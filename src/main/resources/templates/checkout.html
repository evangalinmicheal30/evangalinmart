<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Checkout | Evangalinmart</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><div th:replace="~{fragments/navbar :: navbar}"></div><main class="wrap narrow-page"><span class="eyebrow">ALMOST YOURS</span><h1>Where should we deliver your groceries<span class="title-period">?</span></h1><div class="checkout-grid"><form class="checkout-form" th:action="@{/checkout}" method="post"><label>Your name<input name="customerName" th:value="${customerName}" readonly></label><label>Email address<input type="email" name="email" th:value="${email}" readonly></label><label>Delivery address<textarea name="address" required maxlength="500" rows="4" placeholder="Street, city, PIN code"></textarea></label><button class="button button-dark button-wide">Place my order <span>→</span></button><p class="form-note">Your account details are used for delivery and order history. No payment is collected in this demo.</p></form><aside class="summary"><span class="eyebrow">YOUR LITTLE HAUL</span><div class="summary-row"><span>Order total</span><strong th:text="${'₹' + #numbers.formatDecimal(total, 1, 'COMMA', 2, 'POINT')}">₹0.00</strong></div><p>We’ll take good care of your package and send it your way.</p></aside></div></main><footer class="footer"><span>© 2026 Evangalinmart</span><a th:href="@{/cart}">Back to your bag</a></footer></body></html>
