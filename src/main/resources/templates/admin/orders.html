<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Shop orders | Evangalinmart</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><div th:replace="~{fragments/navbar :: navbar}"></div><main class="wrap admin-page"><span class="eyebrow">THE ORDERS YOU’VE RECEIVED</span><h1>Shop orders<span class="title-period">.</span></h1><div class="order-list" th:if="${!#lists.isEmpty(orders)}"><article class="order-card" th:each="order : ${orders}"><div><span class="product-category" th:text="${'ORDER #' + order.id}">ORDER</span><h2 th:text="${order.customerName}">Customer</h2><p th:text="${order.email}">Email</p><p th:text="${order.address}">Address</p></div><strong th:text="${'₹' + #numbers.formatDecimal(order.total, 1, 'COMMA', 2, 'POINT')}">₹0.00</strong></article></div><div class="empty-state" th:if="${#lists.isEmpty(orders)}"><span>✿</span><h3>No orders just yet</h3><p>Your first order will find its way here.</p></div></main><footer class="footer"><a th:href="@{/admin/products}">← Manage products</a><a th:href="@{/}">View the shop</a></footer></body></html>
