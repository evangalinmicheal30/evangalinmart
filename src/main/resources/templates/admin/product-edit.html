<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Edit grocery | Evangalinmart</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><div th:replace="~{fragments/navbar :: navbar}"></div><main class="wrap narrow-page"><span class="eyebrow">SELLER DESK</span><h1>Edit grocery<span class="title-period">.</span></h1><form class="checkout-form admin-form" th:action="@{/admin/products/{id}/edit(id=${product.id})}" th:object="${product}" method="post"><label>Product name<input th:field="*{name}" required></label><label>Category<input th:field="*{category}" required></label><label>Description<textarea th:field="*{description}" required rows="3"></textarea></label><label>Price (₹)<input th:field="*{price}" type="number" min="0.01" step="0.01" required></label><label>Image URL<input th:field="*{imageUrl}" type="url"></label><label class="checkbox-label"><input th:field="*{featured}" type="checkbox"> Mark as a fresh pick</label><button class="button button-dark">Save changes →</button><a class="continue-link" th:href="@{/admin/products}">Cancel</a></form></main><footer class="footer"><a th:href="@{/admin/products}">← Back to seller desk</a><span>© 2026 Evangalinmart</span></footer></body></html>
