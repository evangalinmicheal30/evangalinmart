<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Manage groceries | Evangalinmart</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><div th:replace="~{fragments/navbar :: navbar}"></div><main class="wrap admin-page"><span class="eyebrow">YOUR FRESH MARKET</span><h1>Manage groceries<span class="title-period">.</span></h1><p class="admin-intro">Add fresh produce and pantry picks to Evangalinmart. View received orders at <a th:href="@{/admin/orders}">/admin/orders</a>.</p><div class="admin-grid"><form class="checkout-form admin-form" th:action="@{/admin/products}" th:object="${product}" method="post"><h2>Add a grocery item</h2><label>Product name<input th:field="*{name}" required></label><label>Category<input th:field="*{category}" required placeholder="Fresh Fruits, Vegetables, Bakery…"></label><label>Description<textarea th:field="*{description}" required rows="3"></textarea></label><label>Price (₹)<input th:field="*{price}" type="number" min="0.01" step="0.01" required></label><label>Image URL<input th:field="*{imageUrl}" type="url" placeholder="https://…"></label><label class="checkbox-label"><input th:field="*{featured}" type="checkbox"> Mark as a fresh pick</label><button class="button button-dark">Add to the market →</button></form><section><h2>In the market <span class="result-count" th:text="${#lists.size(products)}">0</span></h2><div class="admin-list"><article th:each="item : ${products}"><img th:src="${item.imageUrl}" th:alt="${item.name}"><div><strong th:text="${item.name}">Product</strong><span th:text="${item.category}">Category</span></div><b th:text="${'₹' + #numbers.formatDecimal(item.price, 1, 'COMMA', 2, 'POINT')}">₹0</b><div class="seller-actions"><a th:href="@{/admin/products/{id}/edit(id=${item.id})}">Edit</a><form th:action="@{/admin/products/{id}/delete(id=${item.id})}" method="post"><button type="submit">Remove</button></form></div></article></div></section></div></main><footer class="footer"><a th:href="@{/}">← Back to the storefront</a><span>© 2026 Evangalinmart</span></footer></body></html>
